worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # Ocultar la versión de Nginx por seguridad
    server_tokens off;

    # Configuración del Reverse Proxy
    upstream flask_app {
        server web1:5000;
    }

    server {
        listen 80;
        server_name localhost; # En el futuro, cambia esto a tu dominio (ej. www.midominio.com)

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout configurado para manejar procesos largos si los hubiera
            proxy_connect_timeout 75s;
            proxy_read_timeout 300s;
        }
    }
}
